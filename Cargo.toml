[package]
name = "md2docx"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
minijinja = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
pulldown-cmark = "0.12"
docx-rs = "0.4"
ureq = { version = "2.10", features = ["tls"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1.11"
genpdf = { version = "0.2", features = ["images"] }
image = { version = "0.23", default-features = false, features = ["png", "jpeg"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = "0.15.1"
ecow = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
